# ==============================================================================
# Nginx Configuration for lichtmarketinglimited.org
# Place in: /etc/nginx/sites-available/lichtmarketinglimited.org
# Enable with: sudo ln -s /etc/nginx/sites-available/lichtmarketinglimited.org /etc/nginx/sites-enabled/
# ==============================================================================

# HTTP — Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name lichtmarketinglimited.org www.lichtmarketinglimited.org;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Main Application Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lichtmarketinglimited.org www.lichtmarketinglimited.org;

    # SSL Certificate Paths (Auto-managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/lichtmarketinglimited.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lichtmarketinglimited.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Frontend Root (Built React Static Files)
    root /var/www/lichtmarketinglimited.org/frontend;
    index index.html;

    # Cache static assets (JS, CSS, images) for 30 days
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Reverse Proxy to Spring Boot Backend API (Port 8081)
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        client_max_body_size 25M;
    }

    # SPA routing — route all other requests to React index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
